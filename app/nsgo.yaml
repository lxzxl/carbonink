name: CarbonInk
id: app.carbonink.desktop
version: 2.0.0
copyright: "© 2026 CarbonInk"

i18n: { dir: locales, source: en }

release:
  github: lxzxl/carbonink

windows:
  publisher: CarbonInk

updates:
  key: HkKgeSqjLiqKO1yf1OKt51JC8PXJiQKI2FoON04ImOs=
  # Keep update checks disabled in local dev/test builds;
  # CI release builds (.github/workflows/release.yml) pass -channel direct.
  channel: none

icon:
  apple: assets/AppIcon.icns
  png: assets/Icon.png

licenses:
  # github.com/ncruces/go-sqlite3-wasm/v6 uses MIT-0 (MIT No Attribution), which
  # NSGo's classifier does not recognize automatically; keep its notice text.
  allow: [github.com/ncruces/go-sqlite3-wasm/v6]

dev:
  # native: this machine's backend; web: the browser; ios: a connected iPhone; ios_simulator; android: a connected device or emulator.
  target: native
  # true, the default, rebuilds and restarts on save; false runs once and exits with the app.
  hot_reload: true

build:
  output: dist
  # true opens the output directory after building.
  open: false
  targets: [macos_arm64, macos_x64, windows_x64]
