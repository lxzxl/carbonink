guidanceAnswerActionsBody: 「保存」只留草稿，随时可改；「保存并定稿」锁定这条答案、字段转为只读，并记入审计轨迹——按钮随后变成「撤销定稿」，需要时可以退回草稿。
guidanceAnswerActionsTitle: 保存 与 保存并定稿
guidanceAnswerBulkBody: 底部动作条作用于整份问卷：批量生成未答题目、导出 Excel 或 PDF、以及一次性确认全部答案。
guidanceAnswerBulkTitle: 整份问卷的动作
guidanceAnswerCardBody: 问卷里的每个问题都是一张卡片。点「生成答案」，AI 会用这个报告年度的活动数据作答，并在字段下方标出所用的数据来源。
guidanceAnswerCardTitle: 每题一张卡片
guidanceBack: 上一步
guidanceDone: 知道了
guidanceExtractionActionsBody: 「确认」把抽取结果写成一条活动数据，钉住排放因子并完成计算；「放弃」只丢弃这次抽取，文件本身保留。
guidanceExtractionActionsTitle: 确认之后会发生什么
guidanceExtractionStageBody: 系统先判断这份文件属于哪一类（电费单、燃油发票、货运单、差旅、问卷），再用对应阶段的字段模板抽取。阶段决定了下方显示哪些字段。
guidanceExtractionStageTitle: 抽取阶段
guidanceExtractionSwitchBody: 如果阶段判错（例如把燃油发票当成电费单），在这里换成正确的阶段重抽，原来那次抽取会被作废。
guidanceExtractionSwitchTitle: 分类判错了？
guidanceNext: 下一步
guidanceProgress: 第 {current} 步，共 {total} 步
guidanceQuestionnairesListBody: 左侧列出全部外发问卷，可按状态筛选、按到期日排序。选中一行即进入答题界面。
guidanceQuestionnairesListTitle: 按状态与到期日追踪
guidanceQuestionnairesNewBody: 客户发来的 .xlsx 问卷从这里导入。上传后系统会把表格解析成逐题卡片，你在卡片里核对、生成、定稿答案，最后导回同一张表。
guidanceQuestionnairesNewTitle: 从客户问卷开始
guidanceRebindConfirmBody: 确认后这条活动数据就地重算，并写入一条审计事件，其中保留旧因子与旧排放值。已经导出到磁盘的报告文件不受影响，新数值要等下次生成报告才会出现。
guidanceRebindConfirmTitle: 换绑之后
guidanceRebindCurrentBody: 这条活动数据在计算时钉住了某一个版本的排放因子，之后因子库更新也不会悄悄改动它——这正是报告可以复算的前提。
guidanceRebindCurrentTitle: 当前因子是钉住的快照
guidanceRebindPickerBody: 换绑用于这几种情况：因子库发布了更新年份、地域选错了、或者当初匹配到的并不是合适的条目。选中新因子后可以先看重算预览。
guidanceRebindPickerTitle: 什么时候该换
guidanceReportDeliverableBody: 把报告、明细表与证据文件打成一个 ZIP 交给客户，附带列明每个文件的清单。
guidanceReportDeliverableTitle: 交付包
guidanceReportExportBody: 一次写出两份：PDF 用于交付，Excel 附录保留可逐条核对的明细表。
guidanceReportExportTitle: 导出 PDF 与 Excel
guidanceReportScopeBody: 报告按 ISO 14064-1 的范围汇总：范围一是直接排放，范围二是外购电力与热力，范围三是其他价值链间接排放。分到哪一组取决于活动数据所属排放源的设定，不是导出时才决定的。
