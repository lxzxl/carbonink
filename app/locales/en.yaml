guidanceAnswerActionsBody: Save keeps a draft you can keep editing. Save & finalize locks the answer, makes the fields read-only and records it in the audit trail — the button then becomes Unfinalize if you need to reopen it.
guidanceAnswerActionsTitle: Save vs. finalize
guidanceAnswerBulkBody: 'The bottom bar acts on the whole questionnaire: generate every unanswered question, export to Excel or PDF, and finalize all answers at once.'
guidanceAnswerBulkTitle: Whole-questionnaire actions
guidanceAnswerCardBody: Every question in the workbook gets a card. Generate an answer and the AI answers from this reporting year's activity data, showing the source it used under the field.
guidanceAnswerCardTitle: One card per question
guidanceBack: Back
guidanceDone: Got it
guidanceExtractionActionsBody: Confirm turns the extraction into an activity-data row, pins an emission factor to it and computes the emissions. Discard drops this extraction; the file itself stays.
guidanceExtractionActionsTitle: What confirming does
guidanceExtractionStageBody: CarbonInk first classifies the file — utility bill, fuel receipt, freight note, travel, questionnaire — then extracts with that stage's field template. The stage decides which fields you see below.
guidanceExtractionStageTitle: Extraction stage
guidanceExtractionSwitchBody: If the classification missed — a fuel receipt read as a utility bill — switch to the right stage here and re-extract. The previous extraction is discarded.
guidanceExtractionSwitchTitle: Wrong stage?
guidanceNext: Next
guidanceProgress: Step {current} of {total}
guidanceQuestionnairesListBody: Every outbound questionnaire is listed here. Filter by status, sort by due date, and select a row to open its answers.
guidanceQuestionnairesListTitle: Track by status and due date
guidanceQuestionnairesNewBody: Import the .xlsx a customer sent you here. CarbonInk parses the workbook into one card per question — you review and finalize the answers on those cards, then export back into the same workbook.
guidanceQuestionnairesNewTitle: Start from a customer questionnaire
guidanceRebindConfirmBody: Confirming recomputes this activity in place and writes an audit event that keeps the old factor and the old emissions. Reports already exported to disk are untouched — the new figure appears the next time you generate one.
guidanceRebindConfirmTitle: After rebinding
guidanceRebindCurrentBody: This activity pinned one emission-factor version when it was computed. Later library updates never silently change it — that is what keeps a finished report reproducible.
guidanceRebindCurrentTitle: The current factor is a pinned snapshot
guidanceRebindPickerBody: Rebind when the library publishes a newer year, when the geography was wrong, or when the original match was not the right entry. Pick a factor and preview the recomputation before you commit.
guidanceRebindPickerTitle: When to rebind
guidanceReportDeliverableBody: Bundles the report, its detail tables and the evidence files into one ZIP to hand to the client, with a manifest listing every file.
guidanceReportDeliverableTitle: Deliverable bundle
guidanceReportExportBody: 'One click writes both: the PDF for delivery and the Excel appendix with the detail tables an auditor can check against.'
guidanceReportExportTitle: Export PDF and Excel
guidanceReportScopeBody: 'Totals are grouped the ISO 14064-1 way: Scope 1 direct emissions, Scope 2 purchased electricity and heat, Scope 3 other value-chain emissions. The grouping comes from each activity''s emission source, not from anything chosen at export time.'
guidanceReportScopeTitle: How Scope 1 / 2 / 3 are grouped
