name: Release

# CarbonInk desktop release pipeline (NSGo).
#
# One macOS runner builds every desktop installer: Go cross-compiles the
# Windows executable, and NSIS compiles the setup program. The update key
# signs the appcasts for Sparkle and WinSparkle. The release is uploaded as a
# draft so Windows and first-run import QA finish before it goes live.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Install NSIS
        # The Windows installer is built on this Mac, as the NSGo docs
        # prescribe; without makensis the build only leaves the .nsi script.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install makensis

      - name: Import optional macOS signing certificate
        env:
          NSGO_MAC_CERT_P12: ${{ secrets.NSGO_MAC_CERT_P12 }}
          NSGO_MAC_CERT_PASSWORD: ${{ secrets.NSGO_MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$NSGO_MAC_CERT_P12" ] || [ -z "$NSGO_MAC_CERT_PASSWORD" ]; then
            echo "Skipping macOS signing certificate import (credentials not configured)."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/nsgo-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/mac-cert.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$NSGO_MAC_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$NSGO_MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Build installers and appcasts
        working-directory: app
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
          NSGO_SIGN_IDENTITY: ${{ secrets.NSGO_SIGN_IDENTITY }}
          NSGO_NOTARY_KEY: ${{ secrets.NSGO_NOTARY_KEY }}
          NSGO_NOTARY_KEY_ID: ${{ secrets.NSGO_NOTARY_KEY_ID }}
          NSGO_NOTARY_ISSUER: ${{ secrets.NSGO_NOTARY_ISSUER }}
          NSGO_WIN_CERT_B64: ${{ secrets.NSGO_WIN_CERT_B64 }}
          NSGO_CERTIFICATE_PASSWORD: ${{ secrets.NSGO_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$NSGO_UPDATES_KEY" ]; then
            echo "::error::NSGO_UPDATES_KEY is not configured."
            exit 1
          fi
          args=(
            -target macos_arm64,macos_x64,windows_x64
            -version "${GITHUB_REF_NAME#v}"
            -channel direct
          )
          if [ -n "$NSGO_SIGN_IDENTITY" ]; then
            args+=(-sign "$NSGO_SIGN_IDENTITY")
          fi
          if [ -n "$NSGO_WIN_CERT_B64" ]; then
            echo "$NSGO_WIN_CERT_B64" | base64 --decode > "$RUNNER_TEMP/win-codesign.pfx"
            args+=(-certificate "$RUNNER_TEMP/win-codesign.pfx")
          fi
          go tool nsgo build "${args[@]}"
          rm -f "$RUNNER_TEMP/win-codesign.pfx"

      - name: Verify release assets and smoke-test app
        working-directory: app
        run: |
          for f in \
            dist/releases/carbonink-*-macos-arm64.dmg \
            dist/releases/carbonink-*-macos-x64.dmg \
            dist/releases/carbonink-*-windows-x64-setup.exe \
            dist/releases/appcast-macos_arm64.xml \
            dist/releases/appcast-macos_x64.xml \
            dist/releases/appcast-windows_x64.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::missing release asset: $f"
              exit 1
            fi
          done
          for feed in dist/releases/appcast-*.xml; do
            if ! grep -q '<enclosure ' "$feed" || ! grep -q 'edSignature=' "$feed"; then
              echo "::error::invalid or unsigned appcast: $feed"
              exit 1
            fi
          done
          app_bin="$(find dist -path '*-macos_arm64/CarbonInk.app/Contents/MacOS/CarbonInk' | head -n 1)"
          if [ -z "$app_bin" ]; then
            echo "::error::missing macOS arm64 app binary"
            exit 1
          fi
          "$app_bin" --mcp < /dev/null

      - name: Upload draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            app/dist/releases/*.dmg
            app/dist/releases/*-setup.exe
            app/dist/releases/*.sha256
            app/dist/releases/appcast-*.xml
