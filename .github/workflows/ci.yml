name: CI

# Pre-merge validation gate. Runs on every PR and every push to main.
#
# Jobs:
#   - validate     — Astro build for cloud/web (catches missing imports / SSR
#                    breakage / build-time TS errors)
#   - go-app       — go vet, pure-Go package tests, and Linux cross-compile
#   - go-app-macos — go tool nsgo check, full Go tests, and headless UI tests
#
# cloud-deploy.yml hangs off this workflow via `workflow_run`: a
# successful main-branch CI run triggers the cloud auto-deploy. PR
# runs never trigger deploy.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # PR: cancel the older run when a newer commit lands on the same PR
  # — no point validating an obsolete commit. Main: never cancel, every
  # SHA gets its own validation pass (and its own potential cloud
  # deploy downstream).
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # `--frozen-lockfile` rejects pnpm-lock.yaml drift — keeps CI
        # honest if someone bumps package.json without regenerating
        # the lockfile.
        run: pnpm install --frozen-lockfile

      - name: Build cloud web (Astro)
        # Doubles as a smoke test for the SSR Worker entry — Astro
        # build refuses to emit if any TS/import error blocks
        # prerender of the marketing pages.
        run: pnpm cloud:build:web

  go-app:
    # Compiles the NSGo module and runs all pure-Go domain packages on Linux.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test pure-Go packages
        run: go test $(go list ./... | grep -v -E '(/internal/app|/internal/spike)$' | grep -v '^app\.carbonink\.desktop$')

      - name: Cross-compile the Linux backend
        run: go build ./...

  go-app-macos:
    # Runs the full NSGo check and headless UI test suite on macOS.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Check NSGo module and locales
        run: go tool nsgo check

      - name: Run Go and NSGo headless UI tests
        run: go test ./... && go tool nsgo test ./internal/app && go tool nsgo test .
