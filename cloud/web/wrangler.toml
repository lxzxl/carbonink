# carbonink-cloud-web — the only deployed worker. Serves the static
# Astro marketing site across all of carbonink.xyz/*.
#
# Every page prerenders to CDN HTML: /, /download, /privacy + their
# /zh/ mirrors. There is no /api/* route — the open-source pivot retired
# the backend (license/payments/accounts), torn down fully 2026-08-24.
#
# Astro 6's @astrojs/cloudflare adapter injects the Worker entry
# (`main`) at build time pointing to `dist/_worker.js/index.js`, so
# `main` is intentionally absent here. Putting it in this file
# triggers the bundled @cloudflare/vite-plugin to resolve the path
# BEFORE astro produces it, which fails.

name = "carbonink-cloud-web"
compatibility_date = "2025-05-23"
compatibility_flags = ["nodejs_compat"]

# Catch-all under carbonink.xyz — captures the whole zone. (The old
# more-specific /api/* route to the backend worker is gone, so this
# owns every URL.)
routes = [
  { pattern = "carbonink.xyz/*", zone_name = "carbonink.xyz" },
]

[assets]
directory = "./dist"

# No secrets: the site is fully static — no Stripe key, no license key,
# no sessions. The pre-pivot /activate SSR route needed STRIPE_SECRET_KEY;
# that route and its secret are gone.
