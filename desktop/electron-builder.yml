# electron-builder configuration
# Docs: https://www.electron.build/configuration

appId: app.carbonink.desktop
productName: CarbonInk
copyright: Copyright © 2026 Seneca ESG Limited

directories:
  output: release
  buildResources: build

# Prune foreign-arch canvas prebuilds per target (Intel-mac fix) — see
# build/after-pack-prune-canvas.cjs. Top-level key: safe (unlike platform
# `files`, hooks merge normally).
afterPack: ./build/after-pack-prune-canvas.cjs

files:
  - out/**/*
  - "!out/main/**/*.map"
  - "!out/preload/**/*.map"
  - "!out/renderer/**/*.map"
  # --- Installer slimming (audit 2026-10-08, docs/todo/2026-10-08-slimming-checklist.md) ---
  # The packer ships every production dependency, but most of node_modules is
  # never required at runtime: renderer code is bundled into out/renderer by
  # vite, the AI SDKs are inlined into out/main (ESM-only, see
  # electron.vite.config.ts), and build tools sit in `dependencies`. Every
  # entry below was verified unreachable from out/{main,preload,mcp} via a
  # require-closure walk (see checklist Phase 0). If you add a main-process
  # dependency under an excluded scope/name, REMOVE its exclusion here or the
  # packed app will crash at require() time.
  # Dev-only artifacts inside shipped packages (never loaded by Node):
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.d.mts"
  - "!node_modules/**/*.d.cts"
  # Closed-world: only out/** + package.json ship from the project dir.
  # Background: the packer falls back to include-all file matching when its
  # `pnpm list` production-graph lookup fails (observed locally with pnpm 12:
  # scripts/, tests/, src/ and 140MB of script caches landed in app.asar).
  # These negations keep the package clean in both collector modes. After any
  # change here, re-pack and confirm no APP: junk via an asar listing.
  - "!scripts{,/**/*}"
  - "!tests{,/**/*}"
  - "!src{,/**/*}"
  - "!messages{,/**/*}"
  - "!samples{,/**/*}"
  - "!test-results{,/**/*}"
  - "!project.inlang{,/**/*}"
  - "!agent-skill{,/**/*}"
  - "!*.md"
  - "!*.xlsx"
  - "!*.{ts,mts,cts,mjs,json}"
  - "!.*"
  # Entire scopes, verified 100% unreachable (every member checked):
  - "!node_modules/{@radix-ui,@tanstack,@babel,@aws-sdk,@smithy,@aws-crypto,@jridgewell,@protobufjs,@floating-ui,@types,@esbuild,@rollup,@anthropic-ai,@google,@mistralai,@earendil-works}/**"
  # Build tools misplaced in `dependencies` (used by scripts, not the app):
  - "!node_modules/{electron-vite,vite,esbuild,rollup}/**"
  # Renderer-only (bundled into out/renderer by vite, never required):
  - "!node_modules/{react,react-dom,lucide-react,radix-ui,react-resizable-panels,react-top-loading-bar,cmdk,sonner,vaul,driver.js,tailwind-merge,class-variance-authority,clsx,scheduler}/**"
  # AI SDKs inlined into out/main (never required from node_modules):
  - "!node_modules/{openai,protobufjs,typebox,seroval,seroval-plugins,gaxios,ws,node-fetch}/**"
  - "!node_modules/{web-streams-polyfill,fast-xml-parser,fast-xml-builder,caniuse-lite,browserslist,baseline-browser-mapping,electron-to-chromium,node-releases,update-browserslist-db}/**"
  - "!node_modules/{csstype,bignumber.js,bowser,json5,magic-string,source-map-js,long,path-expression-matcher,postcss,picomatch,cac,tslib,ignore,tinyglobby,fdir}/**"
  - "!node_modules/{google-auth-library,google-logging-utils,gcp-metadata,fsevents,yaml,json-schema-to-ts}/**"
  # NOTE: zod-to-json-schema is NOT excluded — @modelcontextprotocol/sdk
  # requires it at runtime (its package root has no index, so naive
  # require-closure walks miss it; caught by packed-app probe 2026-10-08).
  # Per-package dead weight (entry point + runtime imports verified):
  - "!node_modules/exceljs/dist/**"
  - "!node_modules/pdfjs-dist/{build,web,types,image_decoders,cmaps,standard_fonts,wasm}/**"
  - "!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
  - "!node_modules/pdfjs-dist/legacy/build/{pdf.worker.mjs,pdf.worker.min.mjs,pdf.min.mjs,pdf.sandbox.mjs,pdf.sandbox.min.mjs}"
  - "!node_modules/pdf-parse/dist/{node,worker}/**"
  - "!node_modules/pdf-parse/dist/pdf-parse/{esm,web}/**"
  - "!node_modules/pdf-parse/node_modules/pdfjs-dist/**"
  # pdf-parse pins canvas 0.1.80 whose prebuild materializes as a duplicate
  # 23MB binary at pack time. Dev already resolves pdf-parse's canvas require
  # to the top-level 0.1.100 prebuild (verified: real getText + pdfToImages
  # render pass); dropping the nested copy forces the same resolution packed.
  - "!node_modules/pdf-parse/node_modules/@napi-rs/**"
  - "!node_modules/effect/dist/{esm,dts}/**"
  - "!node_modules/effect/src/**"
  - "!node_modules/better-sqlite3/{deps,src}/**"
  - "!node_modules/better-sqlite3/build/Release/{obj,obj.target}/**"
  - "!node_modules/better-sqlite3/build/Release/{sqlite3.a,test_extension.node}"

# Unpack the MCP server script so external MCP clients can spawn it
# at <Resources>/app.asar.unpacked/out/mcp/index.js. Files inside
# app.asar cannot be spawned as Node scripts via ELECTRON_RUN_AS_NODE.
asarUnpack:
  - out/mcp/**

# Ship the bundled agent-skill (SKILL.md + README.md) flat under
# <Resources>/agent-skill/. AgentSkillService reads
# process.resourcesPath/agent-skill/SKILL.md at install time to seed
# the user's ~/.agents/skills/carbonink-mcp/ canonical copy.
extraResources:
  - from: agent-skill
    to: agent-skill

# --- macOS ---
mac:
  category: public.app-category.business
  target:
    # dmg only — deliberately NO `zip` target. The zip would exist solely to
    # feed Squirrel.Mac auto-install, which validates the downloaded bundle
    # against the running app's designated requirement — cdhash-pinned for
    # ad-hoc signatures, so a different version can never pass. The in-app
    # updater is therefore notify-only on macOS (src/main/updater/
    # auto-updater.ts); if real Developer ID signing returns, add `zip` back
    # and upload *.zip/*.zip.blockmap in release.yml.
    - target: dmg
      arch:
        - arm64
        - x64
  # Do NOT set `identity:` here. `identity: null` explicitly opts out
  # of signing and is NOT overridden by CSC_LINK env vars. By omitting
  # the key, electron-builder auto-detects the "Developer ID Application"
  # identity from the keychain populated by CSC_LINK / CSC_KEY_PASSWORD
  # in CI (and falls back to ad-hoc / unsigned for local dev builds).
  # hardenedRuntime with an ad-hoc signature only launches because
  # entitlements.mac.plist carries cs.disable-library-validation — see the
  # comment there before touching either side of that pair.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Unsigned, open-source build: notarization is OFF (no Apple Developer
  # credentials after the open-source pivot). macOS Gatekeeper will show
  # "unidentified developer" → users right-click → Open on first launch.
  # With no `identity` set, electron-builder ad-hoc signs the .app.
  notarize: false
  # NOTE (slimming): do NOT add a `files:` block here. In electron-builder
  # v26 a platform-level `files` REPLACES the top-level `files` (no merge),
  # which reverts the main matcher to include-all `**/*` and ships scripts/,
  # tests/, src/ and caches into app.asar (observed 2026-10-08: +160MB).
  # Per-OS canvas filtering is unnecessary anyway: CI installs only the
  # building OS's optional deps, so foreign prebuilds are never packed.

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# --- Windows ---
# Signing is performed by Azure Trusted Signing via a custom signtool
# invocation (see `sign` hook below). We deliberately do NOT use
# WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD — those expect a .pfx file, which
# Azure Trusted Signing (HSM-backed) cannot export.
win:
  target:
    - target: nsis
      arch:
        - x64
  # Delegate signing to a custom script that calls the Azure-provided
  # Trusted Signing dlib via signtool. The `azure/trusted-signing-action`
  # in the GitHub workflow installs signtool + the dlib and exports the
  # env vars consumed here.
  #
  # electron-builder v26: sign + signingHashAlgorithms moved under
  # signtoolOptions (was at win.* root in v25 and earlier).
  # NOTE (slimming): no `files:` block here either — see the mac note above.
  signtoolOptions:
    sign: ./build/sign-windows.js
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# --- Auto-update publish target ---
# GitHub Releases. electron-updater reads the channel manifest
# (stable-mac.yml / stable.yml) + the installer from the release assets of the
# matching tag; release.yml uploads all three. The app's app-update.yml is
# generated from this block at packaging time (no runtime URL needed).
#
# Heads-up: v1.0.0 shipped with the old generic/R2 target, so v1.0.0 installs
# won't auto-update. v1.0.1+ (built from this config) will.
publish:
  provider: github
  owner: lxzxl
  repo: carbonink
  channel: stable

# --- electron-builder will look for these build resources ---
# build/
#   icon.icns        (macOS)
#   icon.ico         (Windows)
#   icon.png         (fallback)
#   entitlements.mac.plist
